# Demo pipeline showing how to use scripts/publish-dist-release.sh.
#
# It builds a dist package and, only for tag pipelines (i.e. when a GitLab
# Release is created for a version tag), publishes that dist package into
# another repository on the branch matching the tag's major.minor version.
#
# Required CI/CD variable (Settings > CI/CD > Variables), masked & protected:
#   DIST_REPO_URL - full git URL of the target repo with auth embedded,
#                   e.g. https://oauth2:<token>@gitlab.example.com/group/dist-repo.git

stages:
  - build
  - publish

build:
  stage: build
  image: node:20
  script:
    # Replace with this project's actual build command.
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+(-.+)?$/'

publish-dist:
  stage: publish
  image: alpine:3.19
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+(-.+)?$/'
  before_script:
    - apk add --no-cache bash git
  script:
    - ./scripts/publish-dist-release.sh
      --tag "$CI_COMMIT_TAG"
      --dist "dist"
      --target-repo "$DIST_REPO_URL"
